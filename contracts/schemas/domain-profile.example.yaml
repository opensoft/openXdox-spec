# EXAMPLE, NOT THE INSTANCE.
#
# openxFactory's own engineering profile, written against
# `domain-profile.schema.yaml` to prove the shape carries a real domain. It is
# an EXAMPLE here because the REAL instance is authored at
# `opensoft/openxFactory` — design.md § D3's third column, kept there by RULING
# DQ-1 ("openxFactory KEEPS its own adapter") — in § 4.4's code half, which is
# held until BUILD slice 2b lands (openxFactory#656 comment 5628886636).
# Nothing loads this file at runtime.
#
# Every row is read off `openxFactory/docs/document-lifecycle.md`
# (`Status: standard`) and this repository's own
# `contracts/schemas/gate-action-record.schema.yaml`, cited in `basis:` and
# per-transition in `basis:` lines, so a reviewer can check a row rather than
# trust it. See `docs/domain-profile-design-note.md` § 3.
#
# READ FROM `opensoft/openxFactory` `main` `38c076d1` OVER THE API, not from a
# local checkout. An earlier revision of this example was read from a stale
# working tree, declared EIGHT statuses, and called the "nine-word" taxonomy a
# citation defect. That was false and is retracted (openxFactory#656 comment
# 5633989351). The table carries NINE; the ninth is `projection`.

schema_version: 1
kind: domain-profile

mapping_id: openxfactory-engineering
domain_label: "xFactory engineering governance"
declared_by: "opensoft/openxFactory"
neutral: false

basis:
  - "openxFactory/docs/document-lifecycle.md (Status: standard) — the controlled Status table, Status Claim Rules, and Gates In Practice"
  - "openXdox-spec contracts/schemas/gate-action-record.schema.yaml:165 — the act enum and the per-action artifact requirements"
  - "openxFactory openspec/changes/split-opendox-two-layer-product/specs/domain-mapping-declaration/spec.md — the five axes and the two refusals"
  - "RULING C2, openxFactory#656 2026-09-04T17:47Z; RULED OQ-3, comment 5547107565; RULING DQ-1, comment 5547049745"

# ------------------------------------------------------------------- AXIS 1
artifact_kinds:
  - id: governance-document
    label: "Governance document"
    description: >-
      A prose document carrying the controlled `Status:` header. The thing the
      lifecycle spine is written for.
    locations: ["docs/**/*.md", "ideation/**/*.md", "review/**/*.md"]
    is_default: true
  - id: staging-topic
    label: "Staging topic"
    description: >-
      A feat-spec-shaped fragment in the work queue, declaring target
      capability, delta type, claims, open questions and exit path.
    locations: ["ideation/staging/<topic>/"]
  - id: openspec-change
    label: "OpenSpec change"
    description: "An active proposal: proposal.md, tasks.md, design.md and spec deltas."
    locations: ["openspec/changes/<change-id>/"]
  - id: evidence-record
    label: "Evidence record"
    description: >-
      A generated report, simulation, audit or gate-action record. CAPTURED
      ONCE, immutable on write; excluded from prose-to-spec conversion and
      contradiction checks.
    locations: ["health/", "review/", "ideation/dashboard/gate-records/"]
    # `review/**/*.md` is also governance-document's. The STATUS decides, not
    # the path: an artifact carrying `record` is an evidence record.
    claims_statuses: [record]
  - id: projection-document
    label: "Projection document"
    description: >-
      A document a NAMED GENERATOR re-derives IN PLACE from a declared source
      of truth. A separate kind from `evidence-record` because the two differ
      on the one thing that decides their governance: a record is CAPTURED
      once, a projection is RE-DERIVED forever. "Being generated is not what
      makes a document a `record`; being CAPTURED is." The live instance is
      `ideation/cross-reference.md` (`Status: projection`, `Kind: report`),
      re-rendered from `ideation/cross-reference.yaml` by
      `scripts/render-ideation-cross-reference.py`, which the document's own
      header names alongside its source revision.
    locations: ["ideation/cross-reference.md"]
    # `ideation/**/*.md` is also governance-document's, and it CONTAINS this
    # path. Without the binding a loader could classify the projection as an
    # ordinary governance document and enforce `immutability_point: ratified`
    # on an artifact whose whole nature is being rewritten.
    claims_statuses: [projection]

# ------------------------------------------------------------------- AXIS 2
lifecycle:

  - artifact_kind: governance-document
    vocabulary:
      - {id: brainstorm,  role: captured,    label: "Brainstorm",  meaning: "Non-normative; lives in ideation/brainstorm/", contradiction_legal: true}
      - {id: staged,      role: organized,   label: "Staged",      meaning: "Structured toward a proposal; not yet policy"}
      - {id: draft,       role: proposed,    label: "Draft",       meaning: "Normative intent, not yet ratified"}
      - {id: ratified,    role: ratified,    label: "Ratified",    meaning: "Backed by an approved OpenSpec change, or by a durable ratification record; the header names it"}
      - {id: standard,    role: promoted,    label: "Standard",    meaning: "Backed by a promoted spec or canonical contract; the only status allowed to claim shared-standard authority"}
      - {id: superseded,  role: superseded,  label: "Superseded",  meaning: "Kept for provenance; the header names the successor"}
      - {id: retired,     role: retired,     label: "Retired",     meaning: "Withdrawn; the header names the reason or decision record"}
      - {id: record,      role: out-of-band, label: "Record",      meaning: "Immutable evidence artifact CAPTURED ONCE", excluded_from_conversion: true}
      - {id: projection,  role: out-of-band, label: "Projection",  meaning: "Deterministic RE-DERIVED rendering of a declared source of truth, rewritten in place by a named generator; never authoritative, never hand-edited, and not immutable — regenerating it is the correct act, not a violation", excluded_from_conversion: true}

    terminal_statuses: [superseded, retired, record]

    immutability_point:
      status: ratified
      addenda: cited-change
      note: >-
        Past ratification a document changes only through a cited OpenSpec
        change — the addendum. Post-ratification mutation of a proposal's
        declared origin is reported by the nightly `proposal-origin` doc-health
        family as a CONTESTED finding (document-lifecycle.md, "Origin at the
        proposal gate"). This answer is for documents that TRAVEL THE SPINE.
        The vocabulary's two OUT-OF-BAND statuses do not travel it and are
        governed by their own kinds, where each carries its honest answer:
        `record` by `evidence-record` (immutable on write, corrected by a
        separate document) and `projection` by `projection-document` (never
        immutable, corrected by regeneration). They appear in THIS vocabulary
        because the controlled `Status:` table is ONE table for every
        governance document, and a status a document may legally carry belongs
        in the closed list the engine checks against.

    transitions:
      - from: brainstorm
        to: staged
        authority: lane-author
        basis: "captured -> organized: brainstorm material is selected, deduplicated, and targeted into ideation/staging/ or a candidate register"
      - from: staged
        to: draft
        authority: change-author
        act: propose
        basis: "organized -> proposed: an OpenSpec change is created carrying the spec deltas; proposed prose becomes `draft`"
      - from: draft
        to: ratified
        authority: ratifying-authority
        act: ratify
        basis: "proposed -> ratified -> implemented: standard OpenSpec flow; a `ratified` header names its ratification on exactly ONE citation line"
      - from: ratified
        to: standard
        authority: promoting-authority
        basis: "implemented -> promoted: the change archives and its requirements live under canonical specs; affected docs may claim `standard`. No document may claim `standard` unless a promoted spec or canonical contract backs the claim."
      - from: draft
        to: staged
        authority: gate-actor
        act: demote
        destination_kind: staging-topic
        reverse_of: "staged -> draft"
        basis: >-
          The mechanized reverse transition (D16) — the gate console's
          `demote`, the same move as the 2026-07-13 manual demotion, tooled. A
          demotion without a recorded `reason` is invalid.
      - from: ratified
        to: staged
        authority: gate-actor
        act: demote
        destination_kind: staging-topic
        reverse_of: "staged -> draft"
        basis: "The same act applied to a ratified change being returned to the queue."
      - from: ratified
        to: superseded
        authority: ratifying-authority
        basis: "superseded: kept for provenance; the header names the successor"
      - from: standard
        to: superseded
        authority: ratifying-authority
        basis: "the same rule applied to a promoted document"
      - from: ratified
        to: retired
        authority: ratifying-authority
        basis: "retired: withdrawn; the header names the reason or decision record"
      - from: standard
        to: retired
        authority: ratifying-authority
        basis: "the same rule applied to a promoted document"
      - from: null
        to: record
        authority: evidence-producer
        basis: >-
          An ENTRY transition. A record is written AS a record and does not
          travel the spine: "immutable evidence stays `record`" at the proposal
          gate, and out of band elsewhere.
      - from: null
        to: projection
        authority: projection-generator
        basis: >-
          An ENTRY transition. "A re-derived projection carries `projection`"
          at the proposal gate (document-lifecycle.md, "Gates In Practice"),
          and the generator EMITS that status itself rather than having it
          applied later — the promoted requirement's scenario "A generator
          emits the status it declares". There is no transition OUT: a
          projection is neither promoted nor superseded, it is regenerated,
          which is the immutability point's `regenerated` addendum and not a
          status change.

  - artifact_kind: openspec-change
    vocabulary:
      - {id: draft,      role: proposed,   label: "Active proposal"}
      - {id: ratified,   role: ratified,   label: "Ratified"}
      - {id: standard,   role: promoted,   label: "Archived with promotion"}
      - {id: superseded, role: superseded, label: "Superseded"}
    terminal_statuses: [standard, superseded]
    immutability_point:
      status: ratified
      addenda: cited-change
      note: >-
        A change's declared origin is "fixed at creation and immutable for the
        life of the change"; strict per-change verification and the archive
        gate reject missing, malformed, dual-kind or manifest-disagreeing
        origins.
    transitions:
      - {from: null,     to: draft,      authority: change-author,       basis: "proposal-support.py transition writes the staged origin automatically"}
      - {from: draft,    to: ratified,   authority: ratifying-authority, act: ratify}
      - {from: ratified, to: standard,   authority: promoting-authority, basis: "the change archives and its requirements live under canonical specs"}
      - {from: draft,    to: superseded, authority: ratifying-authority}

  - artifact_kind: staging-topic
    vocabulary:
      - {id: staged, role: organized, label: "Staged"}
      - {id: draft,  role: proposed,  label: "Carried into a proposal"}
    terminal_statuses: [draft]
    immutability_point:
      status: draft
      addenda: cited-change
      note: >-
        A topic's material MOVES with Git history into the change's
        supporting-docs at the proposal gate; ideation/staging/ is a live
        queue, not permanent storage.
    transitions:
      - {from: staged, to: draft, authority: change-author, act: propose, basis: "organized -> proposed"}

  - artifact_kind: evidence-record
    vocabulary:
      - {id: record, role: out-of-band, label: "Record", excluded_from_conversion: true}
    terminal_statuses: [record]
    immutability_point:
      status: record
      addenda: separate-document
      note: >-
        An error in a record is corrected by a SEPARATE document, never by an
        edit. This repository carries the worked example:
        docs/stale-citations-erratum-2026-09-10.md names stale citations in
        three arrived files "without mutating the frozen, byte-identical
        documents".
    transitions:
      - {from: null, to: record, authority: evidence-producer, basis: "written as a record; out of band"}

  - artifact_kind: projection-document
    vocabulary:
      - {id: projection, role: out-of-band, label: "Projection", meaning: "Deterministic RE-DERIVED rendering of a declared source of truth, rewritten in place by a named generator", excluded_from_conversion: true}
    # EMPTY, and declared rather than omitted. No transition leaves
    # `projection`, but terminal means FINISHED — "a revival is a NEW record
    # with a new id" — and a projection is never finished; it is rewritten.
    terminal_statuses: []
    immutability_point:
      status: projection
      addenda: regenerated
      note: >-
        NEVER IMMUTABLE, and declared rather than defaulted — which is the
        whole point of the field being required. A projection holds no captured
        state for immutability to protect: re-running the generator over the
        same path is the ONLY correct way to update it, and "reporting each
        regeneration as a content edit to a record would make the correct act a
        critical finding". The lawful later write is therefore the regeneration
        itself, by the generator the document names. What IS fixed is the
        source: the projection is never authoritative over the artifact it
        renders, so a correction is made in the source and re-derived, never
        typed into the projection.
    transitions:
      - {from: null, to: projection, authority: projection-generator, basis: "written as a projection by its named generator, which emits `Status: projection` itself; out of band"}

# ------------------------------------------------------------------- AXIS 3
gates:
  - id: human-gate-console
    label: "The human gate console"
    actor_class: human
    description: >-
      Agents are structurally unable to author a gate-action record at all: the
      gate console rejects any agent-invoked action before one is ever written
      (gate-action-record.schema.yaml, scenario "An agent invokes a gate
      action"). The gate is authority-bearing.

acts:
  - {id: demote,                    gate: human-gate-console, target_kind: openspec-change,      requires_evidence: [transition-manifest]}
  - {id: edit-apply,                gate: human-gate-console, target_kind: openspec-change}
  - {id: ratify,                    gate: human-gate-console, target_kind: openspec-change,      requires_evidence: [ratification-record]}
  - {id: kickoff,                   gate: human-gate-console, target_kind: openspec-change,      requires_evidence: [workflow-job]}
  - {id: propose,                   gate: human-gate-console, target_kind: staging-topic,        requires_evidence: [workflow-job]}
  - {id: promote-to-staging,        gate: human-gate-console, target_kind: staging-topic,        requires_evidence: [workflow-job]}
  - {id: dispose-possible,          gate: human-gate-console,                                    requires_evidence: [register-update]}
  - {id: derive-possibles,          gate: human-gate-console,                                    requires_evidence: [workflow-job]}
  - {id: research-brief,            gate: human-gate-console,                                    requires_evidence: [workflow-job]}
  - {id: create-document,           gate: human-gate-console, target_kind: governance-document,  requires_evidence: [document]}
  - {id: edit-document,             gate: human-gate-console, target_kind: governance-document,  requires_evidence: [commit]}
  - {id: open-pr,                   gate: human-gate-console,                                    requires_evidence: [pull-request]}
  - {id: abandon-session,           gate: human-gate-console}
  - {id: share-session,             gate: human-gate-console}
  - {id: cleanup-abandoned-branch,  gate: human-gate-console}
  - {id: approve-model,             gate: human-gate-console}
  - {id: create-project,            gate: human-gate-console}
  - {id: edit-project,              gate: human-gate-console}
  - {id: lens-save-recipe,          gate: human-gate-console}
  - {id: lens-add-as-cluster,       gate: human-gate-console}

# ------------------------------------------------------------------- AXIS 4
evidence_classes:
  - {id: ratification-record,  label: "Ratification record",  description: "Required by `ratify` — the durable record a ratified header cites."}
  - {id: workflow-job,         label: "Workflow job",         description: "Required by the dispatching acts; a recorded dispatch, never a decision."}
  - {id: register-update,      label: "Register update",      description: "Required by `dispose-possible` — the updated cross-reference index."}
  - {id: document,             label: "Document",             description: "Required by `create-document`; the created document's relpath is its reference."}
  - {id: commit,               label: "Commit",               description: "Required by `edit-document`; its reference is the record's own action stamp, never a sha."}
  - {id: pull-request,         label: "Pull request",         description: "Required by `open-pr`; the session branch's PR into the Merge-Master ritual."}
  - {id: transition-manifest,  label: "Transition manifest",  description: "The demote plan's executed manifest, naming origin and destination."}

# ------------------------------------------------------------------- AXIS 5
authorities:
  - {id: lane-author,          label: "Lane author",           human_only: false, description: "Selects, deduplicates and targets brainstorm material into the queue."}
  - {id: change-author,        label: "Change author",         human_only: false, description: "Creates the OpenSpec change and carries the staged material into it with its declared origin."}
  - {id: gate-actor,           label: "Gate actor",            human_only: true,  description: "The authenticated human at the gate console. An agent cannot hold this role by construction."}
  - {id: ratifying-authority,  label: "Ratifying authority",   human_only: true,  description: "Ratifies, supersedes and retires. Named as a role; the person holding it is not this declaration's business."}
  - {id: promoting-authority,  label: "Promoting authority",   human_only: true,  description: "Archives with promotion, past which a document may claim `standard`."}
  - {id: evidence-producer,    label: "Evidence producer",     human_only: false, description: "Writes a record. May be a machine: a record is evidence, not an authority claim."}
  - {id: projection-generator, label: "Projection generator",   human_only: false, description: "The NAMED generator that re-derives a projection in place from its declared source. A machine by construction, and never an authority over what it renders: a projection is a rendering, not a claim. The projection names it."}

truth_store:
  name: "The repository and its branch protection"
  external_enforcement_point: >-
    The repository ruleset that makes `validate` a required status check on
    `main` (docs/branch-protection.md), plus code-owner review.
  description: >-
    Named by `domain-mapping-declaration`'s third requirement itself: "the
    repository and its branch protection for an engineering domain". A derived
    model in this domain may propose; it may never write `main`. When the
    enforcement point cannot be reached, the acts that gate on it refuse rather
    than proceeding on the neutral layer's own verdict alone.

notes:
  - >-
    The controlled table in document-lifecycle.md carries NINE statuses:
    brainstorm, staged, draft, ratified, standard, superseded, retired, record,
    projection. The packet and CLAUDE.md call it the "nine-word" taxonomy and
    they are RIGHT. An earlier revision of this example declared eight and
    called the phrase a citation defect; that finding was false — read from a
    stale local checkout — and is retracted at openxFactory#656 comment
    5633989351. Sources for the ninth row: opensoft/openxFactory main 38c076d1
    docs/document-lifecycle.md line 49 (the controlled table) and the promoted
    requirement "Controlled document status taxonomy" at
    opensoft/openxFactory openspec/specs/document-lifecycle/spec.md at main
    38c076d1 — an EXTERNAL path, not one in this repository — whose
    `projection` standing was
    ratified by the archived declare-generated-projection-status (2026-08-28).
  - >-
    `locations` OVERLAP, and that is why `claims_statuses` exists.
    governance-document's `ideation/**/*.md` contains projection-document's
    `ideation/cross-reference.md`, and its `review/**/*.md` contains
    evidence-record's `review/`. A path cannot decide which kind governs an
    artifact; the declared `Status:` header can, and does — which is the same
    principle as the rest of this profile, declare rather than infer. The two
    out-of-band kinds claim their own status; governance-document claims none
    and is the default for the seven spine statuses.
  - >-
    The two OUT-OF-BAND statuses split on `terminal_statuses`, and the split is
    the reason terminality is DECLARED here rather than inferred from the
    transition graph. Neither has an outgoing transition, but terminal means
    FINISHED — the engine's refusal is "this record is finished; a revival is a
    NEW record with a new id" (gate_console.py:1151). `record` is captured once
    and IS finished, so it is terminal, and it now appears in
    governance-document's list beside superseded and retired, matching what the
    evidence-record kind already declared for the same word; its absence there
    was an inconsistency, named by the Copilot review on openXdox-spec #8
    (review comment 3988822633). `projection` is rewritten in place forever and
    is never finished, so it is NOT terminal and projection-document declares an
    empty list. Moving a projection is still refused — by the closed transition
    list rather than by a finished-record message.
  - >-
    `terminal_statuses` on `governance-document` is
    `[superseded, retired, record]`. The `("rejected", "superseded")` pair
    hardcoded at `openXdox-code gate_console.py:1151` is a REGISTER-POSSIBLE
    vocabulary, not a document one — which is why ASK-4 Q4 asked whether
    `terminal_statuses` is per-kind. RULED per kind (openxFactory#656 comment
    5634195861), and this example would gain a SIXTH artifact kind
    (`register-possible`) when the register's own vocabulary is declared.
